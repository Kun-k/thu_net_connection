<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>登录 - 校园网自动登陆</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f5f6f8; display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; }
    .card { background: #fff; padding: 32px 40px; border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 320px; }
    h1 { margin: 0 0 20px; font-size: 18px; color: #222; }
    label { font-size: 13px; color: #555; }
    input[type=password] { width: 100%; padding: 8px 10px; margin: 8px 0 14px;
                           border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 9px; background: #2c6bed; color: #fff; border: none;
             border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1f57c9; }
    .err { color: #c0392b; font-size: 13px; margin-bottom: 8px; }
    .hint { color: #888; font-size: 12px; margin-top: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="">
    <h1>校园网自动登陆 - 访问验证</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label>访问密钥</label>
    <input type="password" name="key" autofocus required />
    <button type="submit">进入</button>
    <div class="hint">密钥在启动 Web 服务时生成，仅显示一次。</div>
  </form>
</body>
</html>
